appId: com.everborn.command   # keep: changing it would install a second app and orphan updates
productName: Command AI
copyright: Copyright © 2026 Everborn Productions
directories:
  output: dist
  buildResources: build
files:
  - electron/**
  - server/**
  - web/**
  - package.json
  - "!data/**"
  - "!dist/**"
  - "!docs/**"
  - "!supabase/**"
  - "!release/**"
  - "!Start Command Center.cmd"
  - "!**/*.map"
asar: true
compression: normal
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.ico
  artifactName: "Command-AI-${version}-${arch}-${os}.${ext}"
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Command AI
  # updates and uninstall keep %APPDATA%\Everborn Command (settings, vault, ledger, projects); the folder keeps
  # its original name on purpose (electron/main.cjs app.setName) so data survives the rename to Command AI
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  artifactName: "Command-AI-Setup-${version}.${ext}"
portable:
  artifactName: "Command-AI-Portable-${version}.${ext}"
# In-app updates: electron-updater reads releases from this PUBLIC repo (the source repo is private,
# and no token is ever embedded in the app). See docs/RELEASING.md.
publish:
  - provider: github
    owner: everbornproductions-stack
    repo: command-center-releases
    releaseType: release
