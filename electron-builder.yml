appId: com.everborn.command   # keep: changing it would install a second app and orphan updates
productName: Meldmind
copyright: Copyright © 2026 Everborn Productions
directories:
  output: dist
  buildResources: build
files:
  - electron/**
  - server/**
  - web/**
  - extension/**
  - package.json
  # server/welcome-mail.js reads emails/welcome.html and welcome.txt at runtime; without them the welcome email says ENOENT
  - emails/**
  - "!data/**"
  - "!dist/**"
  - "!docs/**"
  # What's new and Help read these at runtime, so the installer keeps them.
  - docs/WHATS-NEW.json
  - docs/help/**
  - "!supabase/**"
  - "!release/**"
  - "!Start Command Center.cmd"
  - "!**/*.map"
  # Heavy tools are add-ons. They are never packed into the installer.
  - "!addons/**"
  - "!**/{playwright,playwright-core,puppeteer,lighthouse,tesseract,tesseract.js,whisper,whisperx,piper,godot,bevy,postiz,chatwoot,docuseal}/**"
# Zip codesign toolset. The legacy 7z bundle contains macOS symlinks, and a
# Windows runner cannot unpack those, so packaging stops before the installer exists.
toolsets:
  winCodeSign: "1.1.0"
asar: true
# the browser extension (Phase 24) is loaded unpacked by Chrome / Edge, so it must sit outside app.asar
asarUnpack:
  - extension/**
compression: normal
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.ico
  artifactName: "Meldmind-${version}-${arch}-${os}.${ext}"
  # Code signing: azureSignOptions (Azure Artifact Signing) is not set here on purpose.
  # The release job adds it as -c.win.azureSignOptions.* flags only when every signing
  # value exists (scripts/azure-sign-config.mjs). Local builds and PR CI stay unsigned.
nsis:
  include: build/firewall.nsh
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Meldmind
  # updates and uninstall keep %APPDATA%\Everborn Command (settings, vault, ledger, projects); the folder keeps
  # its original name on purpose (electron/main.cjs app.setName) so data survives the rename to Meldmind
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  artifactName: "Meldmind-Setup-${version}.${ext}"
mac:
  # unsigned until there is an Apple Developer account (see docs/RELEASING.md); zip is what Mac updates use
  # identity null keeps the build unsigned even when a cert is on the Mac
  identity: null
  gatekeeperAssess: false
  target: [dmg, zip]
  category: public.app-category.productivity
  icon: web/icons/icon-512.png
  artifactName: "Meldmind-${version}-${arch}.${ext}"
dmg:
  artifactName: "Meldmind-${version}-${arch}.${ext}"
portable:
  artifactName: "Meldmind-Portable-${version}.${ext}"
# In-app updates: electron-updater reads releases from this PUBLIC repo (the source repo is private,
# and no token is ever embedded in the app). See docs/RELEASING.md.
# Stable channel only. A prerelease suffix must not switch the feed file away from latest.yml.
detectUpdateChannel: false
publish:
  - provider: github
    owner: everbornproductions-stack
    repo: command-center-releases
    # Public releases repo. false on purpose: a true value would send GH_TOKEN and hide the feed.
    private: false
    channel: latest
    releaseType: release
