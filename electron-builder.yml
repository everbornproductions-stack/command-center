appId: com.everborn.command   # keep: changing it would install a second app and orphan updates
productName: Meldmind
copyright: Copyright © 2026 Everborn Productions
directories:
  output: dist
  buildResources: build
files:
  - electron/**
  - server/**
  - web/**
  - extension/**
  - package.json
  # server/welcome-mail.js reads emails/welcome.html and welcome.txt at runtime; without them the welcome email says ENOENT
  - emails/**
  - "!data/**"
  - "!dist/**"
  - "!docs/**"
  # What's new and Help read these at runtime, so the installer keeps them.
  - docs/WHATS-NEW.json
  - docs/help/**
  - "!supabase/**"
  - "!release/**"
  - "!Start Command Center.cmd"
  - "!**/*.map"
  # Heavy tools are add-ons. They are never packed into the installer.
  - "!addons/**"
  - "!**/{playwright,playwright-core,puppeteer,lighthouse,tesseract,tesseract.js,whisper,whisperx,piper,godot,bevy,postiz,chatwoot,docuseal}/**"
  # 0.4.34: node-pty is the built-in terminal Freebuff runs in. Only its lib and ready-made binaries ship: no C++ sources,
  # no debug symbols, no build folder (it loads prebuilds/<os>-<arch>). The other OS binaries are dropped per platform below.
  - "!node_modules/node-pty/{src,deps,third_party,scripts,typings,build}/**"
  - "!node_modules/node-pty/binding.gyp"
  - "!node_modules/node-pty/**/*.pdb"
  - "!node_modules/node-pty/lib/**/*.test.js"
  # 0.4.37 (Chris: voice too computer): the natural voice engine (kokoro-js). The model itself downloads on a click and is
  # never packed. Only what Node loads ships: the Node build of transformers (no web builds, wasm, sources or maps),
  # no onnxruntime-web (the Node build never loads it), and only the six voices offered in Settings > Voice.
  - "!node_modules/onnxruntime-web/**"
  - "!node_modules/@huggingface/transformers/{src,types}/**"
  - "!node_modules/@huggingface/transformers/dist/!(transformers.node.mjs)"
  - "!node_modules/kokoro-js/{types/**,dist/kokoro.web.js,dist/kokoro.cjs}"
  - "!node_modules/kokoro-js/voices/!(af_heart|af_bella|bf_emma|am_michael|am_fenrir|bm_george).bin"
  - "!node_modules/onnxruntime-node/script/**"
# Zip codesign toolset. The legacy 7z bundle contains macOS symlinks, and a
# Windows runner cannot unpack those, so packaging stops before the installer exists.
toolsets:
  winCodeSign: "1.1.0"
# node-pty (0.4.34) is the only native module, and it ships N-API binaries that load in Electron as they are.
# A rebuild would need Visual Studio on the build machine, so electron-builder does not rebuild it.
npmRebuild: false
asar: true
# the browser extension (Phase 24) is loaded unpacked by Chrome / Edge, so it must sit outside app.asar
asarUnpack:
  - extension/**
  # node-pty loads .node binaries and starts helper programs and a worker script; none of that runs from inside app.asar
  - node_modules/node-pty/**
  # 0.4.37: onnxruntime (the natural voice) and sharp (loaded by transformers) are N-API .node files with DLLs beside them
  - node_modules/onnxruntime-node/bin/**
  - node_modules/@img/**
compression: normal
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: build/icon.ico
  artifactName: "Meldmind-${version}-${arch}-${os}.${ext}"
  # the Windows installer is x64 only, so it keeps the win32-x64 node-pty binaries and drops the rest
  files:
    - "!node_modules/node-pty/prebuilds/{darwin-*,win32-arm64,linux-*}/**"
    # 0.4.37: onnxruntime keeps win32 x64 only, without DirectML.dll (18 MB, GPU only; the voice runs on the CPU and
    # onnxruntime loads DirectML only for a GPU session; checked by speaking with the file removed)
    - "!node_modules/onnxruntime-node/bin/napi-v3/{darwin,linux}/**"
    - "!node_modules/onnxruntime-node/bin/napi-v3/win32/arm64/**"
    - "!node_modules/onnxruntime-node/bin/napi-v3/win32/x64/DirectML.dll"
  # Code signing: azureSignOptions (Azure Artifact Signing) is not set here on purpose.
  # The release job adds it as -c.win.azureSignOptions.* flags only when every signing
  # value exists (scripts/azure-sign-config.mjs). Local builds and PR CI stay unsigned.
nsis:
  include: build/firewall.nsh
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Meldmind
  # updates and uninstall keep %APPDATA%\Everborn Command (settings, vault, ledger, projects); the folder keeps
  # its original name on purpose (electron/main.cjs app.setName) so data survives the rename to Meldmind
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  artifactName: "Meldmind-Setup-${version}.${ext}"
mac:
  # unsigned until there is an Apple Developer account (see docs/RELEASING.md); zip is what Mac updates use
  # identity null keeps the build unsigned even when a cert is on the Mac
  identity: null
  # Mac keeps the darwin node-pty binaries only
  files:
    - "!node_modules/node-pty/prebuilds/{win32-*,linux-*}/**"
    - "!node_modules/onnxruntime-node/bin/napi-v3/{win32,linux}/**"
  gatekeeperAssess: false
  target: [dmg, zip]
  category: public.app-category.productivity
  icon: web/icons/icon-512.png
  artifactName: "Meldmind-${version}-${arch}.${ext}"
dmg:
  artifactName: "Meldmind-${version}-${arch}.${ext}"
portable:
  artifactName: "Meldmind-Portable-${version}.${ext}"
# In-app updates: electron-updater reads releases from this PUBLIC repo (the source repo is private,
# and no token is ever embedded in the app). See docs/RELEASING.md.
# Stable channel only. A prerelease suffix must not switch the feed file away from latest.yml.
detectUpdateChannel: false
publish:
  - provider: github
    owner: everbornproductions-stack
    repo: command-center-releases
    # Public releases repo. false on purpose: a true value would send GH_TOKEN and hide the feed.
    private: false
    channel: latest
    releaseType: release
