<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Command AI</title>
<style>
  body { width: 320px; margin: 0; padding: 12px; font: 13px/1.4 system-ui, "Segoe UI", sans-serif; background: #0d131d; color: #e6edf3; }
  h1 { font-size: 12px; letter-spacing: .08em; margin: 0 0 2px; }
  .tag { font-size: 11px; color: #8b98a9; margin-bottom: 10px; }
  label { display: block; font-size: 11px; color: #8b98a9; margin: 8px 0 3px; }
  input, select, textarea { width: 100%; box-sizing: border-box; background: #090d14; color: inherit; border: 1px solid #263244; border-radius: 6px; padding: 6px 8px; font: inherit; }
  textarea { height: 54px; resize: vertical; }
  button { background: #162033; color: inherit; border: 1px solid #263244; border-radius: 6px; padding: 6px 10px; cursor: pointer; margin-top: 8px; font: inherit; }
  button.primary { background: #1f3a66; border-color: #4e8cff; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; }
  .msg { margin-top: 8px; min-height: 16px; font-size: 12px; color: #8b98a9; }
  .msg.err { color: #f87171; } .msg.ok { color: #4ade80; }
  .small { font-size: 11px; color: #8b98a9; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <h1>COMMAND AI</h1>
  <div class="tag">an Everborn product · talks only to the app on this PC</div>

  <section id="pair" hidden>
    <div class="small">In Command AI open Settings &gt; Browser extension &gt; Pair a browser, then paste the code here.</div>
    <label for="code">Pairing code</label>
    <input id="code" autocomplete="off" spellcheck="false" placeholder="cce.4747.…" />
    <button class="primary" id="do-pair">Pair</button>
  </section>

  <section id="main" hidden>
    <div class="small" id="who"></div>
    <label for="action">When I send something</label>
    <select id="action">
      <option value="draft">Put it in Marching orders (I press Send in the app)</option>
      <option value="chat">Ask now (the best AI for the job answers)</option>
      <option value="council">Ask a council (several AIs, then a verdict)</option>
    </select>
    <label for="note">What to do with it (optional)</label>
    <textarea id="note" placeholder="e.g. Turn this into three Instagram captions"></textarea>
    <div class="row">
      <button class="primary" id="send-page">Send this page</button>
      <button id="send-sel">Send selection</button>
    </div>
    <div class="row"><button id="unpair" style="margin-left:auto">Unpair</button></div>
  </section>

  <div id="msg" class="msg"></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
