<!doctype html>
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Command AI</title>
<style>
  body { margin: 0; background: #090d14; color: #e6edf6; font: 15px/1.5 "Segoe UI", system-ui, sans-serif; display: grid; place-items: center; height: 100vh; }
  .card { max-width: 560px; padding: 28px 30px; border: 1px solid #1f2a3b; border-radius: 14px; background: #0e1420; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { color: #c3cddb; margin: 0 0 10px; }
  .reason { font-family: Consolas, monospace; font-size: 12px; color: #fbbf24; background: #131a26; padding: 8px 10px; border-radius: 8px; margin: 8px 0 16px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  button { font: inherit; font-size: 14px; padding: 8px 16px; border-radius: 8px; border: 1px solid #2a3547; background: #131a26; color: #e6edf6; cursor: pointer; }
  button.primary { background: #22d3ee; color: #04121a; border-color: #22d3ee; font-weight: 600; }
  .msg { font-size: 13px; color: #8b98ab; margin-top: 12px; min-height: 18px; }
</style></head>
<body><div class="card">
  <h1>Command AI's engine did not start</h1>
  <p>The app window needs its local engine. You can restart it, or install an update if one is available.</p>
  <div class="reason" id="reason">checking...</div>
  <div class="row">
    <button class="primary" id="restart">Restart engine</button>
    <button id="update">Check for updates</button>
    <button id="log">Open log</button>
  </div>
  <div class="msg" id="msg"></div>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  const q = new URLSearchParams(location.search);
  $("reason").textContent = q.get("reason") || "the engine did not answer";
  let upd = null;
  function showUpd(s) {
    upd = s;
    if (s.version) $("update").textContent = s.phase === "downloading" ? `Downloading ${s.percent || 0}%` : `Install update v${s.version}`;
    $("msg").textContent = s.error ? `Update: ${s.error}` : s.phase === "checking" ? "Checking for updates..." : s.phase === "idle" && s.checkedAt ? `v${s.current} is the newest version.` : "";
  }
  window.ccDesktop.onUpdate(showUpd);
  window.ccDesktop.updateState().then(showUpd);
  $("restart").onclick = () => { $("msg").textContent = "Restarting..."; window.ccDesktop.restart(); };
  $("update").onclick = () => { if (upd && upd.version) window.ccDesktop.installUpdate().catch(() => {}); else window.ccDesktop.checkForUpdates(); };
  $("log").onclick = () => window.ccDesktop.openLog();
</script>
</body></html>
