# Mac test on every pull request and every push to main.
# This runs the same checks as the Windows test job. It does not package a dmg,
# it does not notarize, and it does not publish. The unsigned Mac release build
# stays in docs/ci/mac-build.yml until a Mac can verify it.
name: Mac CI

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: mac-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Smoke
        run: npm run smoke
