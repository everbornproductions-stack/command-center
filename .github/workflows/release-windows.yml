# Windows installer for Meldmind. Publishes a normal release (not a draft, not a
# pre-release) to the public repo everbornproductions-stack/command-center-releases.
# The releases token is used only for that upload. It is never written into the app.
#
# Repo secrets or variables (Settings > Secrets and variables > Actions):
#   CC_SUPABASE_ANON_KEY or SUPABASE_PUBLISHABLE_KEY
#                             publishable key, sb_publishable_...  Never the service key.
#                             The build reads CC_SUPABASE_ANON_KEY first.
#                             A repository variable of the same name is used when
#                             the secret is empty. The release stops when neither is set.
#   RELEASES_TOKEN            fine-grained token, Contents read and write on
#                             command-center-releases only.
#   GOOGLE_OAUTH_CLIENT_SECRET  optional. The Google desktop sign-in secret for one-click
#                             Sign in with Google. Given to the build steps only, written
#                             into server/oauth-clients.json for the build and cleared after.
#                             Missing means Sign in with Google offers the own-client path.
#   Code signing (optional until Microsoft finishes identity validation):
#   variables AZURE_SIGNING_ENDPOINT, AZURE_SIGNING_ACCOUNT, AZURE_SIGNING_PROFILE,
#   AZURE_SIGNING_PUBLISHER and secrets AZURE_TENANT_ID, AZURE_CLIENT_ID,
#   AZURE_CLIENT_SECRET. With any one missing the installer is built unsigned.
#   See docs/RELEASING.md, "Windows code signing".
name: Windows release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          if npm test; then
            exit 0
          fi
          echo "Tests failed once. Retrying the test step once."
          npm test

      - name: Smoke
        run: npm run smoke

      - name: Require the publishable key
        shell: bash
        env:
          CC_SUPABASE_ANON_KEY: ${{ secrets.CC_SUPABASE_ANON_KEY || vars.CC_SUPABASE_ANON_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          # Same check as npm run dist. Prints the variable name only, never the key.
          # Never use the service key.
          node scripts/inject-cloud-key.mjs --check
          if [ -n "${CC_SUPABASE_ANON_KEY}" ]; then
            echo "Publishable key source: CC_SUPABASE_ANON_KEY"
          else
            echo "Publishable key source: SUPABASE_PUBLISHABLE_KEY"
          fi

      - name: Report the Google sign-in secret
        shell: bash
        env:
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          # One plain line for the release log. The value is never printed.
          node scripts/inject-oauth-secret.mjs --check

      # Code signing with Azure Artifact Signing turns on by itself once all seven values
      # exist. Until then this step builds unsigned, as before, and says so in one line.
      # The signing secrets are given to this step only, and no value is printed.
      - name: Build the Windows installer
        id: build
        shell: bash
        env:
          CC_SUPABASE_ANON_KEY: ${{ secrets.CC_SUPABASE_ANON_KEY || vars.CC_SUPABASE_ANON_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ""
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          AZURE_SIGNING_PUBLISHER: ${{ vars.AZURE_SIGNING_PUBLISHER }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          # Signing check: prints one plain line and writes signing=on or signing=off.
          node scripts/azure-sign-config.mjs --check
          SIGN_ARGS=()
          while IFS= read -r line; do
            if [ -n "$line" ]; then SIGN_ARGS+=("$line"); fi
          done < <(node scripts/azure-sign-config.mjs --args)
          if [ "${#SIGN_ARGS[@]}" -eq 0 ]; then
            npm run dist
          else
            npm run dist -- "${SIGN_ARGS[@]}"
          fi

      # Prints Valid or NotSigned. Fails only when signing was set up but the installer
      # is not validly signed. An unsigned build while signing is not set up continues.
      - name: Verify the installer signature
        shell: pwsh
        env:
          SIGNING: ${{ steps.build.outputs.signing }}
        run: |
          $v = node -p "require('./package.json').version"
          $exe = "dist/Meldmind-Setup-$v.exe"
          if (-not (Test-Path $exe)) { Write-Host "Signature check stopped: the build did not produce $exe."; exit 1 }
          $status = (Get-AuthenticodeSignature -FilePath $exe).Status
          Write-Host "Meldmind-Setup-$v.exe signature: $status"
          if ($env:SIGNING -eq "on" -and "$status" -ne "Valid") {
            Write-Host "Release stopped: code signing is set up, but the installer is not validly signed."
            exit 1
          }
          if ($env:SIGNING -ne "on") { Write-Host "Code signing is not set up yet, so an unsigned installer is expected." }
          exit 0

      - name: Publish the normal release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "Release publish stopped: repo secret RELEASES_TOKEN is missing."
            echo "Add a fine-grained personal access token with Contents read and write on everbornproductions-stack/command-center-releases only."
            echo "Do not put that token in the app."
            exit 1
          fi
          V=$(node -p "require('./package.json').version")
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${V}" ]; then
            echo "Release stopped: tag ${GITHUB_REF_NAME} does not match package.json version v${V}."
            exit 1
          fi
          EXE="dist/Meldmind-Setup-${V}.exe"
          MAP="dist/Meldmind-Setup-${V}.exe.blockmap"
          YML="dist/latest.yml"
          for f in "$EXE" "$MAP" "$YML"; do
            if [ ! -f "$f" ]; then
              echo "Release stopped: the build did not produce ${f}."
              exit 1
            fi
          done
          SIZE=$(wc -c < "$EXE" | tr -d '[:space:]')
          if [ "$SIZE" -lt 10000000 ]; then
            echo "Release stopped: ${EXE} is ${SIZE} bytes, which is too small to be the installer."
            exit 1
          fi
          if ! grep -q "Meldmind-Setup-${V}.exe" "$YML"; then
            echo "Release stopped: latest.yml does not name Meldmind-Setup-${V}.exe."
            exit 1
          fi
          if ! grep -q "${V}" "$YML"; then
            echo "Release stopped: latest.yml does not mention version ${V}."
            exit 1
          fi
          node -e 'const fs=require("fs"); const v=require("./package.json").version; const notes=fs.readFileSync("docs/RELEASE-NOTES.md","utf8"); const head="## v"+v+" "; const i=notes.indexOf(head); let text=""; if(i>=0){ const rest=notes.slice(i); const nl=rest.indexOf("\n"); const n=rest.slice(nl+1).search(/^## /m); text=n<0?rest:rest.slice(0,nl+1+n);} else { const news=JSON.parse(fs.readFileSync("docs/WHATS-NEW.json","utf8")); const b=(news[v]&&news[v].bullets)||[]; text=b.length?("Meldmind v"+v+"\n\n"+b.map(function(x){return "- "+x;}).join("\n")):("Meldmind v"+v);} fs.writeFileSync("release-notes.txt", text.trim()+"\n");'
          R=everbornproductions-stack/command-center-releases
          TAG="v${V}"
          if gh release view "$TAG" --repo "$R" >/dev/null 2>&1; then
            gh release upload "$TAG" --repo "$R" --clobber "$EXE" "$MAP" "$YML"
            gh release edit "$TAG" --repo "$R" --draft=false --latest --title "Meldmind v${V}" --notes-file release-notes.txt
          else
            gh release create "$TAG" --repo "$R" --title "Meldmind v${V}" --latest --notes-file release-notes.txt "$EXE" "$MAP" "$YML"
          fi
          gh release view "$TAG" --repo "$R" --json isDraft,isPrerelease,assets --jq '.assets[].name' > release-assets.txt
          DRAFT=$(gh release view "$TAG" --repo "$R" --json isDraft,isPrerelease --jq '.isDraft')
          PRE=$(gh release view "$TAG" --repo "$R" --json isDraft,isPrerelease --jq '.isPrerelease')
          if [ "$DRAFT" != "false" ] || [ "$PRE" != "false" ]; then
            echo "Release stopped: ${TAG} is not a normal release (draft=${DRAFT}, prerelease=${PRE})."
            exit 1
          fi
          for name in "Meldmind-Setup-${V}.exe" "Meldmind-Setup-${V}.exe.blockmap" "latest.yml"; do
            if ! grep -qx "$name" release-assets.txt; then
              echo "Release stopped: ${name} is not on the release."
              exit 1
            fi
          done
          echo "Published ${TAG} to ${R} with the installer, blockmap, and latest.yml."

  # Unsigned Mac disk image and zip. No Apple signing. A missing release stays a draft
  # so a Mac-only upload cannot replace latest.yml. Automatic updates for Mac are coming soon.
  mac-release:
    # Mac builds are paused to save GitHub minutes until version 0.7.0 (Chris, 2026-10-22). They
    # run only when the repository variable BUILD_MAC is "true" or when someone starts this by hand.
    if: ${{ vars.BUILD_MAC == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Smoke
        run: npm run smoke

      - name: Require the publishable key
        env:
          CC_SUPABASE_ANON_KEY: ${{ secrets.CC_SUPABASE_ANON_KEY || vars.CC_SUPABASE_ANON_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY }}
        run: node scripts/inject-cloud-key.mjs --check

      - name: Build unsigned dmg and zip
        env:
          CC_SUPABASE_ANON_KEY: ${{ secrets.CC_SUPABASE_ANON_KEY || vars.CC_SUPABASE_ANON_KEY }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY || vars.SUPABASE_PUBLISHABLE_KEY }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ""
        run: npm run dist:mac

      - name: Upload to the releases repo
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then echo "RELEASES_TOKEN secret is not set; skipping upload. Files are in the workflow artifacts."; exit 0; fi
          V=$(node -p "require('./package.json').version")
          R=everbornproductions-stack/command-center-releases
          gh release view "v$V" --repo "$R" >/dev/null 2>&1 || gh release create "v$V" --repo "$R" --draft --title "Meldmind v$V" --notes "Mac build (unsigned)."
          gh release upload "v$V" --repo "$R" --clobber dist/*.dmg dist/*.zip dist/*.blockmap dist/latest-mac.yml

      - uses: actions/upload-artifact@v4
        with:
          name: meldmind-mac
          path: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml
