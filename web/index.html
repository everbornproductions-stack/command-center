<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b111b" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Meldmind" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<title>Meldmind</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/styles.css" />
<link rel="stylesheet" href="/look-tokens.css" />
<link rel="stylesheet" href="/look.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%230b0f17' stroke='%2322d3ee' stroke-width='2'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%2322d3ee'/%3E%3C/svg%3E" />
</head>
<body>
<a class="skip-link" href="#view">Skip to content</a>
<div id="app" class="app">
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true"></span>
      <span class="brand-name" title="Take command of all your AIs.">Meldmind</span><span class="brand-tag small dim" title="by Everborn Productions">an Everborn product</span>
    </div>
    <button type="button" class="btn sm nav-toggle" id="nav-toggle" aria-controls="tabs" aria-expanded="false">Menu</button>
    <nav class="tabs" id="tabs" aria-label="Main">
      <button data-view="command" class="active" aria-current="page">Command</button>
      <button data-view="projects">Projects</button>
      <button data-view="credits">Credits</button>
      <button data-view="subscriptions">Subscriptions</button>
      <button data-view="settings">Settings</button>
      <button data-view="setup" id="tab-setup">Find my AIs</button>
    </nav>
    <div class="top-right">
      <div class="mode-switch" id="mode-toggle" role="group" aria-label="Simple or Expert">
        <button type="button" id="mode-simple" data-ui-mode="simple" aria-pressed="true">Simple</button>
        <button type="button" id="mode-expert" data-ui-mode="expert" aria-pressed="false">Expert</button>
      </div>
      <div class="pill" id="budget-pill" title="API spend this month vs budget"><span class="pill-k">Month</span><span id="budget-val">$0.00</span></div>
      <div class="pill" id="cloud-pill" role="status" aria-label="Running in the cloud" title="Running in the cloud" hidden><span class="dot green" aria-hidden="true"></span><span id="cloud-txt">Cloud</span></div>
      <div class="pill" id="conn-pill" role="status" aria-label="Connection to the engine"><span class="dot grey" id="conn-dot" aria-hidden="true"></span><span id="conn-txt">connecting</span></div>
      <div class="clock" id="clock" aria-hidden="true"></div>
    </div>
  </header>

  <div class="view-col">
    <div class="notices" id="notices">
      <div id="update-bar" class="update-bar" role="region" aria-label="Update" style="display:none"></div>
    </div>
    <main class="view" id="view" tabindex="-1"></main>
  </div>

  <aside class="feed" id="feed" aria-label="Live feed">
    <div class="feed-head">
      <span>Live feed</span>
      <button class="ghost" id="feed-clear" title="Clear the live feed">clear</button>
    </div>
    <div class="feed-list" id="feed-list" role="log" aria-live="off"></div>
  </aside>

  <footer class="strip" id="strip" aria-label="Status of your AIs"></footer>
  <nav class="mobile-nav" id="mobile-nav" aria-label="Main">
    <button data-view="command"><i aria-hidden="true">◎</i>Command</button>
    <button data-view="projects"><i aria-hidden="true">▦</i>Projects</button>
    <button data-simple-create hidden><i aria-hidden="true">✦</i>Create</button>
    <button data-view="credits" data-expert-nav><i aria-hidden="true">$</i>Credits</button>
    <button data-view="subscriptions" data-expert-nav><i aria-hidden="true">↻</i>Subs</button>
    <button data-feed data-expert-nav><i aria-hidden="true">≡</i>Feed</button>
    <button data-view="help"><i aria-hidden="true">?</i>Help</button>
    <button data-view="settings"><i aria-hidden="true">⚙</i>Settings</button>
  </nav>
</div>
<div id="gate" class="gate" style="display:none"></div>
<div id="toasts" class="toasts" role="status" aria-live="polite"></div>
<script type="module" src="/app.js"></script>
</body>
</html>
